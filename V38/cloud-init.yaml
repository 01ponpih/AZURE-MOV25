#cloud-config
package_update: true
packages:
  - nginx
  - python3-venv
  - python3-pip

write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html lang="sv">
      <head>
        <meta charset="UTF-8">
        <title>Novatrix AB - Support</title>
        <style>
          body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
          .container { background: #ffffff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
          h1 { text-align: center; color: #333; margin-top: 0; }
          p { text-align: center; color: #555; margin-bottom: 25px; }
          label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
          input, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
          button { margin-top: 25px; width: 100%; padding: 12px 20px; background-color: #0078d4; color: white; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
          button:hover { background-color: #005a9e; }
        </style>
      </head>
      <body>
        <div class="container">
          <h1>Novatrix AB</h1>
          <p>Hej! Fyll i uppgifterna nedan, vi svarar inom 24h.</p>
          <form action="/submit" method="post" enctype="multipart/form-data">
            <label for="namn">Namn</label>
            <input type="text" id="namn" name="namn" required>
            
            <label for="epost">E-post</label>
            <input type="email" id="epost" name="epost" required>
            
            <label for="meddelande">Meddelande</label>
            <textarea id="meddelande" name="meddelande" rows="5" required></textarea>
            
            <label for="bilaga">Bifoga fil (om du vill)</label>
            <input type="file" id="bilaga" name="bilaga">
            
            <button type="submit">Skicka</button>
          </form>
        </div>
      </body>
      </html>

  - path: /opt/novatrix-app/app.py
    content: |
      from flask import Flask, request
      from azure.identity import DefaultAzureCredential
      from azure.storage.blob import BlobServiceClient
      import json, uuid, datetime

      app = Flask(__name__)

      STORAGE_ACCOUNT = "{{STORAGE_ACCOUNT}}"
      CONTAINER = "{{CONTAINER_NAME}}"

      credential = DefaultAzureCredential()
      blob_service = BlobServiceClient(
          account_url=f"https://{STORAGE_ACCOUNT}.blob.core.windows.net",
          credential=credential
      )
      container_client = blob_service.get_container_client(CONTAINER)

      @app.route("/health", methods=["GET"])
      def health():
          return "OK", 200

      @app.route("/submit", methods=["POST"])
      def submit():
          arende_id = str(uuid.uuid4())
          data = {
              "id": arende_id,
              "namn": request.form.get("namn"),
              "epost": request.form.get("epost"),
              "meddelande": request.form.get("meddelande"),
              "tid": datetime.datetime.utcnow().isoformat()
          }

          container_client.upload_blob(
              name=f"{arende_id}/kontakt.json",
              data=json.dumps(data, ensure_ascii=True),
              overwrite=True
          )

          if "bilaga" in request.files and request.files["bilaga"].filename:
              fil = request.files["bilaga"]
              container_client.upload_blob(
                  name=f"{arende_id}/{fil.filename}",
                  data=fil.stream.read(),
                  overwrite=True
              )

          # Centrerad HTML-sida for bekraftelse utan a, a, o
          html_response = f"""
          <!DOCTYPE html>
          <html lang="sv">
          <head>
            <meta charset="UTF-8">
            <title>Tack!</title>
            <style>
              body {{ font-family: sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }}
              .success-box {{ background: #ffffff; padding: 50px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; box-sizing: border-box; }}
              h1 {{ color: #107c10; font-size: 3rem; margin-top: 0; margin-bottom: 10px; }}
              p {{ color: #333; font-size: 1.2rem; margin-bottom: 20px; }}
              .ref-box {{ background: #f3f2f1; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 1.1rem; color: #000; word-break: break-all; }}
            </style>
          </head>
          <body>
            <div class="success-box">
              <h1>Tack!</h1>
              <p>Ditt case har nu skapats.</p>
              <div class="ref-box">
                <strong>Referens:</strong><br>{arende_id}
              </div>
            </div>
          </body>
          </html>
          """
          return html_response, 200

      if __name__ == "__main__":
          app.run(host="127.0.0.1", port=5000)

  - path: /etc/systemd/system/novatrix-app.service
    content: |
      [Unit]
      Description=Novatrix backend
      After=network.target

      [Service]
      ExecStart=/opt/novatrix-app/venv/bin/python /opt/novatrix-app/app.py
      Restart=always
      User=azureuser

      [Install]
      WantedBy=multi-user.target

  - path: /etc/nginx/sites-available/default
    content: |
      server {
        listen 80 default_server;
        listen [::]:80 default_server;
        root /var/www/html;
        index index.html;

        location / {
          try_files $uri $uri/ =404;
        }

        location /submit {
          proxy_pass http://127.0.0.1:5000/submit;
          proxy_set_header Host $host;
        }

        location /health {
          proxy_pass http://127.0.0.1:5000/health;
        }
      }

runcmd:
  - python3 -m venv /opt/novatrix-app/venv
  - /opt/novatrix-app/venv/bin/pip install --upgrade pip
  - /opt/novatrix-app/venv/bin/pip install flask azure-identity azure-storage-blob
  - chown -R azureuser:azureuser /opt/novatrix-app
  - systemctl daemon-reload
  - systemctl enable novatrix-app
  - systemctl restart novatrix-app
  - systemctl enable nginx
  - systemctl restart nginx
